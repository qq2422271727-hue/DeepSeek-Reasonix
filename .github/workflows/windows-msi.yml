name: Build Windows MSI (personal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: bundle windows-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-x64

      - name: Install root deps
        run: npm ci

      - name: Build CLI bundle (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Download bundled Node runtime
        working-directory: desktop
        run: npm run bundle:node

      - name: Check desktop dist exists
        working-directory: desktop
        run: |
          echo "=== desktop/dist contents ==="
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select-Object FullName } else { echo "dist/ NOT FOUND!" }
          echo "=== root dist contents ==="
          if (Test-Path ..\dist) { Get-ChildItem ..\dist | Select-Object FullName } else { echo "root dist/ NOT FOUND!" }

      - name: Build Tauri app (verbose)
        working-directory: desktop
        env:
          TAURI_PRIVATE_KEY: ""
          TAURI_KEY_PASSWORD: ""
          RUST_BACKTRACE: "1"
          RUST_LOG: "debug"
        run: |
          echo "=== Starting tauri build ==="
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --verbose 2>&1
          echo "=== Tauri build exit code: $LASTEXITCODE ==="

      - name: List build outputs
        if: always()
        working-directory: desktop
        run: |
          echo "=== target/release contents ==="
          if (Test-Path src-tauri\target\x86_64-pc-windows-msvc\release) {
            Get-ChildItem src-tauri\target\x86_64-pc-windows-msvc\release -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
          } else { echo "target dir not found" }
          echo "=== bundle contents ==="
          if (Test-Path src-tauri\target\x86_64-pc-windows-msvc\release\bundle) {
            Get-ChildItem src-tauri\target\x86_64-pc-windows-msvc\release\bundle -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
          } else { echo "bundle dir not found" }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-desktop-windows-x64
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/*.log
          if-no-files-found: warn
          retention-days: 14
