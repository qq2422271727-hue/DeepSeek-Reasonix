name: Build Windows MSI (personal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: bundle windows-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-x64

      - name: Install root deps
        run: npm ci

      - name: Build CLI bundle (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop frontend (Vite)
        working-directory: desktop
        run: npx vite build

      - name: Download bundled Node runtime
        working-directory: desktop
        run: npm run bundle:node

      - name: Disable updater signing (no cert in personal build)
        working-directory: desktop
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.createUpdaterArtifacts = $false
          $conf.plugins.updater.active = $false
          # Remove beforeBuildCommand to avoid double-building frontend
          $conf.build.beforeBuildCommand = ""
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          Write-Host "updater disabled, beforeBuildCommand cleared"

      - name: Build Tauri bundle (unsigned)
        working-directory: desktop
        shell: pwsh
        run: npx @tauri-apps/cli build --target x86_64-pc-windows-msvc --verbose

      - name: List bundle output
        shell: pwsh
        run: |
          Write-Host "=== MSI ==="
          Get-ChildItem desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -ErrorAction SilentlyContinue | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}
          Write-Host "=== NSIS ==="
          Get-ChildItem desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -ErrorAction SilentlyContinue | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}
          Write-Host "=== EXE size ==="
          Get-Item desktop/src-tauri/target/x86_64-pc-windows-msvc/release/reasonix-desktop.exe -ErrorAction SilentlyContinue | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-desktop-windows-x64
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
