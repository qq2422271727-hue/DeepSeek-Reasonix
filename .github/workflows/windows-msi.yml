name: Build Windows MSI (personal)

# 手动触发：在 Actions 页面点 Run workflow 即可。
# 产物以 Artifact 形式附在这次 Run 的结果里，点 Summary 底部下载。
# 不走 Release 流程，不需要打 tag。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: bundle windows-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-x64

      - name: Install root deps
        run: npm ci

      - name: Build CLI bundle (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Download bundled Node runtime
        working-directory: desktop
        run: npm run bundle:node

      - name: Build Tauri bundle (unsigned)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target x86_64-pc-windows-msvc

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-desktop-windows-x64
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
